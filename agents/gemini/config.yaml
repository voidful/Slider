interface:
  display_name: "Slider"
  short_description: "Create and revise evidence-backed paper presentations."
  icon: "presentation"
  color: "#0f172a"

platform: gemini
version: "24"

# Gemini CLI uses the root SKILL.md natively.
# No separate instruction file is needed.
instructions_source: "../../SKILL.md"

# Gemini CLI accesses references/ directly from the skill directory.
# No explicit knowledge file listing is required.

# For Gemini Gems (web app), paste the contents of
# agents/chatgpt/system_prompt.md into the Gem instructions text box.
# Check the current host for upload and execution support.
gem_fallback: "agents/chatgpt/system_prompt.md"
